name: Feature Request
description: Suggest a new feature for Reforge
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How should this work?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Other approaches you've thought about
  - type: dropdown
    id: workflow
    attributes:
      label: Affected Workflow
      options:
        - Understand
        - Redesign
        - Reference
        - Rebuild
        - Boilerplate
        - Other
    validations:
      required: true
