# Reforge Project Model Schema
#
# The shared intermediate representation between all Reforge skills.
# Every skill reads relevant sections and writes its findings here.
# File: .agents/skills/reforge/schemas/project-model.schema.yaml
#
# Evidence Format (used throughout):
#   evidence:
#     - source: "file path or description"
#       lines: "line range or null"
#       type: code | config | asset | documentation | git | inference
#   confidence: HIGH | MEDIUM | LOW
#   reasoning: "brief explanation"
#
# Evidence Classification:
#   OBSERVED    — directly visible in source code
#   INFERRED    — conclusion drawn from multiple observations
#   HYPOTHESIZED — plausible but not confirmed
#   RECOMMENDED — suggestion, not fact

# ============================================================
# SECTION 1: FINGERPRINT
# ============================================================
fingerprint:
  project:
    name: ""
    type: ""  # mobile | web | desktop | library | cli | api
    framework: ""
    language: ""
    framework_version: ""
    language_version: ""

  architecture:
    pattern: ""  # feature_first | layer_first | clean | mvvm | mvc | redux | other
    state_management: ""
    dependency_injection: ""
    navigation:
      package: ""
      pattern: ""  # declarative | imperative | hybrid

  backend:
    type: ""  # rest | graphql | firebase | supabase | grpc | none
    base_url: ""
    auth_type: ""  # jwt | session | oauth | api_key | biometric | none

  ui:
    design_system: ""  # material | cupertino | custom | hybrid
    theme: ""
    dark_mode: ""  # supported | not_supported | system_only
    responsive: true

  testing:
