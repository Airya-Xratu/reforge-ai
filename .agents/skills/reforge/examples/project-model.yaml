# Example Project Model: TaskFlow
# A fictional task management mobile app built with Flutter

fingerprint:
  project:
    name: "taskflow"
    type: mobile
    framework: flutter
    language: dart
    framework_version: "3.22.0"
    language_version: "3.4.0"
  architecture:
    pattern: feature_first
    state_management: flutter_bloc
    dependency_injection: get_it
    navigation:
      package: go_router
      pattern: declarative
  backend:
    type: rest
    base_url: "https://api.taskflow.app/v2"
    auth_type: jwt
  ui:
    design_system: custom
    theme: material3
    dark_mode: supported
  testing:
    unit: true
    widget: true
    integration: false
    e2e: false
  platforms:
    android: true
    ios: true
  stats:
    source_files: 156
    test_files: 38
    total_dependencies: 24
    total_screens: 10
    total_features: 6
  evidence:
    - source: "pubspec.yaml"
      type: config
      detail: "Flutter 3.22, BLoC, GoRouter, get_it"
  confidence: HIGH

features:
  - id: "feature_001"
    name: "Task Management"
    category: core
    evidence:
      - source: "lib/features/tasks/"
        type: code
        detail: "Full feature with data/domain/presentation layers"
    confidence: HIGH
    user_value: high
    complexity: medium
    maturity: complete
    screens: ["screen_001", "screen_002", "screen_003"]
    apis: ["/api/tasks"]
    models: ["Task"]
    dependencies: []

  - id: "feature_002"
    name: "Search"
    category: core
    evidence:
      - source: "lib/features/search/"
        type: code
    confidence: HIGH
    user_value: high
    complexity: medium
    maturity: complete
    screens: ["screen_004"]
    apis: ["/api/tasks/search"]
    dependencies: ["feature_001"]

  - id: "feature_003"
    name: "Contacts"
    category: secondary
    evidence:
      - source: "lib/features/contacts/"
        type: code
    confidence: HIGH
    user_value: medium
    complexity: low
    maturity: complete
    screens: ["screen_005", "screen_006"]
    apis: ["/api/contacts"]
    models: ["Contact"]

  - id: "feature_004"
    name: "Push Notifications"
    category: secondary
    evidence:
      - source: "lib/services/notification_service.dart"
        type: code
        detail: "Service exists but partially wired"
    confidence: MEDIUM
    user_value: medium
    complexity: medium
    maturity: partial

screens:
  - id: "screen_001"
    name: "TaskListScreen"
    file: "lib/features/tasks/presentation/screens/task_list_screen.dart"
    purpose: "Display and manage task list"
    type: full_page
    feature_id: "feature_001"
    entry_points:
      - from: "launcher"
        trigger: "app start"
        route: "/tasks"
    exit_points:
      - to: "screen_002"
        trigger: "task card tap"
        type: action
      - to: "screen_003"
        trigger: "FAB tap"
        type: action
    components:
      - type: AppBar
        name: "TaskAppBar"
      - type: ListView
        name: "TaskListView"
      - type: FloatingActionButton
    data_fields:
      - name: "tasks"
        type: "List<Task>"
    states: ["initial", "loading", "loaded", "empty", "error"]
    evidence:
      - source: "lib/features/tasks/presentation/screens/task_list_screen.dart"
        type: code
    confidence: HIGH

  - id: "screen_002"
    name: "TaskDetailScreen"
    file: "lib/features/tasks/presentation/screens/task_detail_screen.dart"
    purpose: "View and manage single task"
    type: full_page
    feature_id: "feature_001"
    entry_points:
      - from: "screen_001"
        trigger: "task card tap"
        route: "/tasks/:id"
    exit_points:
      - to: "screen_001"
        trigger: "back"
        type: back
    components:
      - type: AppBar
      - type: Card
      - type: ActionButtons
    states: ["loading", "loaded", "error"]
    confidence: HIGH

state_machines:
  - screen_id: "screen_001"
    state_model: "TaskListBloc"
    states:
      - name: "initial"
        ui_shown: "LoadingIndicator"
      - name: "loading"
        ui_shown: "LoadingIndicator"
      - name: "loaded"
        ui_shown: "TaskCard list"
        data: ["tasks: List<Task>"]
      - name: "empty"
        ui_shown: "EmptyStateWidget"
      - name: "error"
        ui_shown: "ErrorWidget"
    transitions:
      - from: "initial"
        to: "loading"
        trigger: "initState"
      - from: "loading"
        to: "loaded"
        trigger: "TasksLoaded"
      - from: "loading"
        to: "error"
        trigger: "TaskError"
      - from: "loading"
        to: "empty"
        trigger: "TasksLoaded (empty)"
    edge_cases:
      - scenario: "Network failure"
        handling: "Error state with retry"
        coverage: complete
      - scenario: "Token expiry"
        handling: "Not handled"
        coverage: missing
    confidence: HIGH

navigation:
  entry_points:
    - source: "launcher"
      target: "screen_001"
      route: "/tasks"
  flows:
    - name: "Task Flow"
      screens: ["screen_001", "screen_002", "screen_003"]
      entry: "screen_001"
      linear: false
  evidence:
    - source: "lib/core/router/routes.dart"
      type: config
  confidence: HIGH

