    reasoning: "Generally clean, accumulating minor debt"
  testability:
    score: 58
    evidence:
      - "38 tests / 156 files = 24% ratio (MEDIUM)"
      - "Widget tests present (HIGH)"
      - "No integration tests (HIGH)"
    reasoning: "Decent foundation, coverage gaps"
  documentation:
    score: 42
