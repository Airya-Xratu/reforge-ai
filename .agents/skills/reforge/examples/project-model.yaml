  confidence: HIGH

architecture:
  pattern: feature_first
  modules:
    - name: "tasks"
      imports: ["shared", "core"]
    - name: "search"
      imports: ["shared", "core", "tasks"]
    - name: "contacts"
      imports: ["shared", "core"]
    - name: "shared"
      imports: ["core"]
    - name: "core"
      imports: []
  circular_dependencies: []
  state_management:
    approach: "flutter_bloc"
  networking:
    client: "dio"
    error_handling: "ErrorHandler interceptor"
  persistence:
    local_db: "hive"
  di:
    framework: "get_it"
  testing:
    levels:
      unit: true
      widget: true
      integration: false
  evidence:
    - source: "lib/core/di/injection.dart"
      type: code
  confidence: HIGH

