contradictions:
  - description: "README claims 'full test coverage' but only 24% file ratio"
    claim_source: "README.md"
    reality_source: "test/ directory (38 files)"
    confidence: HIGH
    impact: "Misleading documentation"
    recommendation: "Update README to reflect actual coverage"

dead_code:
  - artifact: "lib/features/debug/"
    type: screen
    evidence: "No route, no navigation entry, only import is self-referencing"
    confidence: MEDIUM
    risk: "Low — debug feature, likely intentional"

decision_log:
  - id: "decision_001"
    decision: "Keep get_it for DI (no migration recommended)"
    reason: "Team is productive with get_it. Migration cost high, benefit low."
    confidence: HIGH
    overridden: false
