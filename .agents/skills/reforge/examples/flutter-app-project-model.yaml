# Example: TaskMaster Project Model (excerpt)
# Full project_model.yaml would be ~500+ lines

fingerprint:
  project:
    name: "taskmaster"
    type: mobile
    framework: flutter
    language: dart
    framework_version: "3.22.0"
    language_version: "3.4.0"
  architecture:
    pattern: feature_first
    state_management: flutter_bloc
    dependency_injection: get_it
    navigation:
      package: go_router
      pattern: declarative
  backend:
    type: rest
    auth_type: jwt
  ui:
    design_system: custom
    theme: material3
    dark_mode: supported
  testing:
    unit: true
    widget: true
    integration: true
    e2e: false
  platforms:
    android: true
    ios: true
    web: false
    desktop: false
  stats:
    source_files: 187
    test_files: 42
    total_dependencies: 28
    total_screens: 12
    total_features: 8
  evidence:
    - source: "pubspec.yaml"
      type: config
      detail: "Flutter project with BLoC, go_router, get_it"
  confidence: HIGH

