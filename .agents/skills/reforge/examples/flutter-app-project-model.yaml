      - "BLoC pattern used throughout (HIGH)"
    reasoning: "Highly consistent codebase"

decision_log:
  - id: "decision_001"
    decision: "Recommend replacing get_it with injectable for DI"
    reason: "get_it requires manual registration; injectable generates registrations"
    evidence:
      - source: "lib/core/di/injection.dart"
        type: code
        detail: "87 manual getIt.registerFactory calls"
    alternatives:
      - "Keep get_it — works, team knows it"
      - "Use riverpod — different paradigm, bigger migration"
    tradeoffs: "injectable adds code generation step but reduces boilerplate"
    confidence: MEDIUM
    overridden: false
    override_reason: ""

overrides: []
