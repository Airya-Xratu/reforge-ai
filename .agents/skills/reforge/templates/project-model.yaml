# Reforge Project Model
# Canonical shared state for all sub-skills.
# Each sub-skill reads relevant sections and writes its findings here.
# File: reforge/project-model.yaml

# ============================================================
# EVIDENCE FORMAT (used throughout)
# ============================================================
# Every finding must include:
#   evidence:
#     - source: "file path or description"
#       lines: "line range or null"
#       type: "code | config | asset | documentation | git | inference"
#     confidence: HIGH | MEDIUM | LOW
#     reasoning: "brief explanation of how conclusion was reached"

# ============================================================
# SECTION 1: FINGERPRINT (project-archaeologist)
# ============================================================
fingerprint:
  project:
    name: ""
    type: ""  # mobile | web | desktop | library | cli | api
    framework: ""
    language: ""
    framework_version: ""
    language_version: ""
  
  architecture:
    pattern: ""  # feature_first | layer_first | clean | mvvm | mvc | redux | other
    state_management: ""
    dependency_injection: ""
    navigation:
      package: ""
      pattern: ""  # declarative | imperative | hybrid
  
  backend:
    type: ""  # rest | graphql | firebase | supabase | grpc | none
    base_url: ""
    auth_type: ""  # jwt | session | oauth | api_key | biometric | none
  
  ui:
    design_system: ""  # material | cupertino | custom | hybrid
    theme: ""
    dark_mode: ""  # supported | not_supported | system_only
    responsive: true
  
  testing:
    unit: false
    widget: false
    integration: false
    e2e: false
    mocking_library: ""
  
  platforms:
    android: false
    ios: false
    web: false
    desktop: false
  
  stats:
    source_files: 0
    test_files: 0
    total_dependencies: 0
    total_screens: 0
    total_features: 0
  
  evidence: []
  confidence: HIGH | MEDIUM | LOW

